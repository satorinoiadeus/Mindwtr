name: Build Osh Coffee Clash

on:
  push:
    branches: [fangyuan-fighter]
    paths:
      - 'meme-fighter/**'
      - '.github/workflows/build-osh-coffee-clash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore game source
        run: |
          mkdir -p meme-fighter/project
          base64 -d meme-fighter/source.zip.b64 > /tmp/osh-coffee-clash.zip
          unzip -o /tmp/osh-coffee-clash.zip -d meme-fighter/project
          echo 'Restored files:'
          find meme-fighter/project -maxdepth 2 -type f -print

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Windows and Android
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: ./meme-fighter/project
          use_preset_export_path: true
          presets_to_export: Windows Desktop,Android
          export_debug: true
          verbose: true

      - name: Show outputs
        if: always()
        run: |
          find meme-fighter/project/build -maxdepth 4 -type f -print 2>/dev/null || true

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OshCoffeeClash-Windows
          path: meme-fighter/project/build/windows/OshCoffeeClash.exe
          if-no-files-found: error

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OshCoffeeClash-Android
          path: meme-fighter/project/build/android/OshCoffeeClash.apk
          if-no-files-found: error
