name: Build Osh Coffee Clash

on:
  push:
    branches: [fangyuan-fighter]
    paths:
      - 'meme-fighter/**'
      - '.github/workflows/build-osh-coffee-clash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore and upgrade game source
        run: |
          mkdir -p meme-fighter/project
          base64 -d meme-fighter/source.zip.b64 > /tmp/osh-coffee-clash.zip
          unzip -o /tmp/osh-coffee-clash.zip -d meme-fighter/project
          cp meme-fighter/v2/main.gd meme-fighter/project/main.gd
          python3 -m pip install --quiet pillow
          python3 meme-fighter/v2/generate_assets.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('meme-fighter/project/project.godot')
          s = p.read_text()
          s = s.replace('config/name="Osh Coffee Clash"', 'config/name="Osh Coffee Clash v2"')
          s = s.replace('\nrendering/textures/vram_compression/import_etc2_astc=true\n', '\n')
          needle = '[rendering]\n'
          if needle not in s:
              raise SystemExit('Missing [rendering] section')
          if 'textures/vram_compression/import_etc2_astc=true' not in s:
              s = s.replace(needle, needle + 'textures/vram_compression/import_etc2_astc=true\n', 1)
          p.write_text(s)
          PY
          test "$(find meme-fighter/project/assets -name '*.png' | wc -l)" -eq 100
          echo "Generated asset count: $(find meme-fighter/project/assets -name '*.png' | wc -l)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      - name: Install Godot 4.5.1 and templates
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          cp /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz -O /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          "$HOME/.local/bin/godot" --version

      - name: Configure Android signing and SDK paths
        run: |
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Satori,C=KG"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "/tmp/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project
        run: |
          "$HOME/.local/bin/godot" --headless --path meme-fighter/project --import --verbose

      - name: Smoke test game launch
        run: |
          set -o pipefail
          "$HOME/.local/bin/godot" --headless --path meme-fighter/project --quit-after 10 2>&1 | tee /tmp/osh-runtime.log
          if grep -E "SCRIPT ERROR|Parse Error|Invalid call|Invalid access|ERROR: Failed to load script" /tmp/osh-runtime.log; then
            echo "Runtime smoke test failed"
            exit 1
          fi
          echo "Runtime smoke test passed"

      - name: Export Windows EXE
        run: |
          mkdir -p dist
          "$HOME/.local/bin/godot" --headless --path meme-fighter/project --export-debug "Windows Desktop" "$GITHUB_WORKSPACE/dist/OshCoffeeClash-v2.exe" --verbose
          test -s dist/OshCoffeeClash-v2.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OshCoffeeClash-v2-Windows
          path: dist/OshCoffeeClash-v2.exe
          if-no-files-found: error

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          "$HOME/.local/bin/godot" --headless --path meme-fighter/project --export-debug "Android" "$GITHUB_WORKSPACE/dist/OshCoffeeClash-v2.apk" --verbose
          test -s dist/OshCoffeeClash-v2.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OshCoffeeClash-v2-Android
          path: dist/OshCoffeeClash-v2.apk
          if-no-files-found: error

      - name: Show binaries
        run: ls -lh dist
