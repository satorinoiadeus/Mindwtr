name: Build Osh Coffee Clash

on:
  push:
    branches: [fangyuan-fighter]
    paths:
      - 'meme-fighter/**'
      - '.github/workflows/build-osh-coffee-clash.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore game source
        run: |
          mkdir -p meme-fighter/project
          base64 -d meme-fighter/source.zip.b64 > /tmp/osh-coffee-clash.zip
          unzip -o /tmp/osh-coffee-clash.zip -d meme-fighter/project
          echo 'Restored files:'
          find meme-fighter/project -maxdepth 2 -type f -print

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      - name: Configure Godot Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          cat ~/.config/godot/editor_settings-4.tres

      - name: Export Windows and Android
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz
          relative_project_path: ./meme-fighter/project
          presets_to_export: Windows Desktop,Android
          export_debug: true
          verbose: true

      - name: Collect binaries
        env:
          BUILD_DIR: ${{ steps.export.outputs.build_directory }}
        run: |
          echo "Build directory: $BUILD_DIR"
          find "$BUILD_DIR" -maxdepth 3 -type f -print
          mkdir -p dist
          cp "$BUILD_DIR/Windows Desktop/OshCoffeeClash.exe" dist/OshCoffeeClash.exe
          cp "$BUILD_DIR/Android/OshCoffeeClash.apk" dist/OshCoffeeClash.apk
          ls -lh dist

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: OshCoffeeClash-Windows
          path: dist/OshCoffeeClash.exe
          if-no-files-found: error

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OshCoffeeClash-Android
          path: dist/OshCoffeeClash.apk
          if-no-files-found: error
