name: Still APK and Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main, still-rebuild, still-mobile-redesign-v03]
  pull_request:
    branches: [main, still-rebuild]
permissions:
  contents: read
concurrency:
  group: still-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run desktop -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Still-Windows-EXE
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  android:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.STILL_ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner already provides Android SDK command-line tools.
      # setup-android@v3 tries to install the obsolete 'tools' package on newer runners.
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13846066'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run android:init -- --ci
      - name: Restore optional persistent development signing key
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          STILL_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.STILL_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$STILL_ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
      - run: npm run android:build -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: Still-Android-APK
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
