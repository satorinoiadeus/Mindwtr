name: Build Windows exe
on:
  workflow_dispatch:
    inputs:
      dynamic_crt:
        description: "Use dynamic C runtime (try this if linking fails)"
        type: boolean
        default: false
jobs:
  build:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Use dynamic CRT
        if: ${{ inputs.dynamic_crt }}
        run: echo "RUSTFLAGS=-C target-feature=-crt-static" >> $env:GITHUB_ENV
      - run: bun install
      - name: Run my logic tests
        continue-on-error: true
        run: bun test apps/desktop/src/things/lib
      - name: Build installer
        working-directory: apps/desktop
        run: bunx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
