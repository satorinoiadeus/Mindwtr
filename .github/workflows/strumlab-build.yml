name: StrumLab builds

on:
  push:
    branches: [strumlab-app]
    paths:
      - 'strumlab/**'
      - '.github/workflows/strumlab-build.yml'
    tags:
      - 'strumlab-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: strumlab/go.mod
      - name: Build Windows EXE
        working-directory: strumlab
        run: |
          mkdir -p dist/windows
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o StrumLab.exe .
          python3 tools/build_dist.py
      - name: Upload installable builds
        uses: actions/upload-artifact@v4
        with:
          name: StrumLab-${{ github.sha }}
          path: |
            strumlab/dist/StrumLab-Windows.zip
            strumlab/dist/StrumLab-Mobile.zip
            strumlab/dist/StrumLab-Source.zip
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/strumlab-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            strumlab/dist/StrumLab-Windows.zip \
            strumlab/dist/StrumLab-Mobile.zip \
            strumlab/dist/StrumLab-Source.zip \
            --title "StrumLab ${GITHUB_REF_NAME#strumlab-v}" \
            --generate-notes
